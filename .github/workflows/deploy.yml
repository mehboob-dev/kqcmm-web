name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Don't burn Actions minutes rebuilding when only non-deployed files change:
    # *.md / docs/** never end up in dist/, and scripts/** (admin panel, editor
    # server, tests) is a separate local tool that the deployed site never
    # includes. Push with an empty commit (git commit --allow-empty) or use the
    # manual trigger below to force a build.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy per branch at a time — cancel any run still in progress
# so a quick sequence of pushes doesn't queue multiple builds.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
