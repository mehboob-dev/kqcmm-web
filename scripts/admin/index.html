<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KQCMM Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sidebar: 240px;
  --accent: #7c5cfc;
  --accent-light: rgba(124,92,252,.12);
  --accent-hover: #6a4de6;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --bg: #f0f2f5;
  --bg-card: #fff;
  --border: #e5e7eb;
  --text: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 14px;
  color: var(--text);
}
body { background: var(--bg); height: 100vh; overflow: hidden; }
input, select, textarea, button { font-family: inherit; font-size: inherit; }
a { color: var(--accent); text-decoration: none; }

/* Layout */
.app-layout { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar); flex-shrink: 0;
  background: #fff;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 12px;
  padding: 20px 18px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #4a6cf7);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.sidebar-title { font-size: 15px; font-weight: 700; color: var(--text); }
.sidebar-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.sidebar-tabs {
  display: flex; flex-wrap: wrap; gap: 2px;
  padding: 10px 10px 6px;
  border-bottom: 1px solid var(--border);
}
.sidebar-tab {
  flex: 1; min-width: 60px;
  padding: 6px 4px; border-radius: 6px;
  font-size: 11px; font-weight: 600; text-align: center;
  border: none; cursor: pointer;
  background: transparent; color: var(--text-muted);
  transition: all .15s;
}
.sidebar-tab:hover { background: var(--bg); color: var(--text-secondary); }
.sidebar-tab.active { background: var(--accent-light); color: var(--accent); }

.sidebar-pages { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-search {
  display: flex; align-items: center; gap: 6px;
  margin: 10px 12px; padding: 7px 10px;
  border-radius: 8px; background: var(--bg);
}
.search-icon { font-size: 12px; opacity: .5; }
.search-input {
  flex: 1; border: none; background: transparent;
  color: var(--text); font-size: 12px; outline: none;
}
.search-input::placeholder { color: var(--text-muted); }

.page-list { flex: 1; overflow-y: auto; padding: 2px 0; }
.page-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left;
  padding: 8px 16px; font-size: 12px;
  border: none; cursor: pointer;
  background: transparent; color: var(--text-secondary);
  border-left: 3px solid transparent;
  transition: all .12s;
}
.page-item:hover { background: var(--bg); color: var(--text); }
.page-item.active {
  background: var(--accent-light);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.page-icon { font-size: 13px; flex-shrink: 0; }
.page-empty { padding: 20px; text-align: center; font-size: 12px; color: var(--text-muted); }

.btn-create {
  margin: 8px 12px; padding: 7px; border-radius: 8px;
  border: 1px dashed var(--border);
  background: transparent; color: var(--text-muted);
  cursor: pointer; font-size: 12px; font-weight: 500;
  transition: all .15s;
}
.btn-create:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* Main */
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 24px; height: 56px;
  background: #fff; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.toolbar-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.status-badge {
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.status-badge.saved { background: #ecfdf5; color: #059669; }
.status-badge.unsaved { background: #fffbeb; color: #d97706; }

.content-area {
  flex: 1; overflow: auto;
  padding: 24px;
}

/* Buttons */
.btn {
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: none; cursor: pointer; transition: all .12s;
  white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-danger { background: #fef2f2; color: var(--danger); }
.btn-danger:hover { background: #fee2e2; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg); }

/* Empty state */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
.empty-text { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty-hint { font-size: 13px; color: var(--text-muted); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9999;
  transition: all .25s; opacity: 0; pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
}
.toast.show { opacity: 1; }
.toast.success { background: #065f46; color: #fff; }
.toast.error { background: #991b1b; color: #fff; }

/* Sections */
.section-card {
  background: #fff;
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 12px;
}
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.section-title {
  font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
  color: var(--accent);
}
.section-actions { display: flex; gap: 4px; }

/* Form elements */
.field-group { margin-bottom: 12px; }
.field-label {
  display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
  color: var(--text-muted); margin-bottom: 4px;
}
.field-input, .field-textarea, .field-select {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: #fff; color: var(--text); font-size: 13px;
  transition: border-color .15s; outline: none;
}
.field-input:focus, .field-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.field-textarea { min-height: 80px; line-height: 1.6; resize: vertical; font-family: 'Inter', sans-serif; }
.field-textarea.code { font-family: 'SF Mono', 'Monaco', monospace; font-size: 12px; line-height: 1.5; }
.field-select { appearance: none; cursor: pointer; }

/* Language tabs */
.lang-tabs {
  display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap;
}
.lang-tab {
  padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); cursor: pointer;
  background: #fff; color: var(--text-secondary);
  transition: all .12s;
}
.lang-tab:hover { border-color: var(--accent); color: var(--accent); }
.lang-tab.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

/* Array items */
.array-item {
  background: #fff;
  border-radius: 8px;
  border: 1px solid var(--border);
  padding: 12px;
  margin-bottom: 6px;
  transition: border-color .12s;
}
.array-item:hover { border-color: #d1d5db; }
.array-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.array-badge {
  font-size: 10px; font-weight: 700; color: var(--text-muted);
  background: var(--bg); padding: 2px 8px; border-radius: 4px;
}
.array-controls { display: flex; gap: 3px; }
.btn-icon {
  padding: 3px 7px; border-radius: 4px; font-size: 11px;
  border: none; cursor: pointer;
  background: var(--bg); color: var(--text-secondary);
  transition: all .1s;
}
.btn-icon:hover:not(:disabled) { background: #e5e7eb; }
.btn-icon:disabled { opacity: .3; cursor: default; }
.btn-icon.danger { color: var(--danger); }
.btn-icon.danger:hover { background: #fef2f2; }

.btn-add {
  width: 100%; padding: 8px 0; border-radius: 8px;
  border: 1px dashed var(--border);
  background: transparent; color: var(--accent); cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all .12s;
}
.btn-add:hover { border-color: var(--accent); background: var(--accent-light); }

/* Section group label */
.section-group {
  font-size: 12px; font-weight: 700; color: var(--accent);
  margin-bottom: 8px; padding-bottom: 4px;
  border-bottom: 2px solid var(--accent-light);
}

/* Cards grid */
.card-grid { display: flex; gap: 16px; }
.card-grid .editor-panel { flex: 1; min-width: 0; overflow-y: auto; }
.card-grid .preview-panel {
  width: 360px; flex-shrink: 0; overflow-y: auto;
  border-left: 1px solid var(--border); padding-left: 20px;
}
.preview-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }

@media (max-width: 900px) {
  .preview-panel { display: none; }
}

/* Inline nav editor rows */
.nav-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: #fff; border-radius: 8px;
  border: 1px solid var(--border);
  margin-bottom: 4px;
}
.nav-row:hover { border-color: #d1d5db; }

/* Tag/chip */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500;
  background: var(--bg); color: var(--text-secondary);
}
.tag.success { background: #ecfdf5; color: #059669; }
.tag.warning { background: #fffbeb; color: #d97706; }
.tag.danger { background: #fef2f2; color: #dc2626; }

/* Translation table */
.table-wrap {
  background: #fff; border-radius: 10px;
  border: 1px solid var(--border); overflow: hidden;
}
.table-header {
  display: flex; padding: 10px 16px;
  background: #f9fafb; border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
}
.table-row {
  display: flex; padding: 10px 16px;
  border-bottom: 1px solid #f3f4f6;
  font-size: 13px; cursor: pointer; transition: background .1s;
}
.table-row:hover { background: var(--bg); }
.table-row.active { background: var(--accent-light); }
.table-col-page { flex: 1; font-weight: 500; }
.table-col-lang { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }

/* Progress ring effect */
.pct-high { color: var(--success); }
.pct-mid { color: var(--warning); }
.pct-low { color: var(--danger); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
